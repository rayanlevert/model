services:
  model:
    build: .
    restart: 'no'
    tty: true
    stdin_open: true
    working_dir: /app
    volumes:
      - .:/app
    networks:
      - app-network
    depends_on:
      - percona
      - postgres

  percona:
    image: percona:8.0
    platform: linux/x86_64
    volumes:
      - ./data/mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: "no"
    environment:
      - MYSQL_ROOT_PASSWORD=root-password
    networks:
      - app-network

  postgres:
    image: postgres:18
    platform: linux/x86_64
    volumes:
      - ./data/postgres:/var/lib/postgresql/docker
    ports:
      - "5432:5432"
    restart: "no"
    environment:
      - POSTGRES_PASSWORD=postgres-password
    networks:
      - app-network

networks:
  app-network:
    driver: bridge